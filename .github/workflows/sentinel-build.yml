name: Sentinel build

on:
  push:
    branches: [sentinel]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: sentinel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Brand tooling is in sync with the committed tree
        env:
          # read access to TezSolutions/TezSentinel (logo source, see tools/brand/brand.json)
          GH_TOKEN: ${{ secrets.BRAND_REPO_TOKEN }}
        run: |
          pip install --quiet numpy opencv-python-headless pillow
          python3 tools/whlabel.py --check
          python3 tools/brand/fetch_brand.py
          git diff --exit-code -- app common

      - name: Placeholder google-services.json (push is not configured yet)
        run: |
          python3 - <<'EOF'
          import json
          ids = ["in.tezsolutions.sentinel" + s for s in ("", ".debug", ".minimal", ".minimal.debug")]
          clients = [{"client_info": {"mobilesdk_app_id": f"1:000000000000:android:{i:020x}",
                                      "android_client_info": {"package_name": p}},
                      "api_key": [{"current_key": "AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY00"}]}
                     for i, p in enumerate(ids)]
          json.dump({"project_info": {"project_number": "000000000000", "project_id": "sentinel-placeholder",
                                      "storage_bucket": "sentinel-placeholder.appspot.com"},
                     "client": clients, "configuration_version": "1"}, open("app/google-services.json", "w"))
          EOF

      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SENTINEL_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sentinel.keystore"

      - name: Build signed minimal release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/sentinel.keystore
          KEYSTORE_PASSWORD: ${{ secrets.SENTINEL_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: sentinel
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.SENTINEL_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleMinimalRelease

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-minimal-release
          path: app/build/outputs/apk/minimal/release/*.apk
